<aside [class]="isCollapsed() ? 'w-20' : 'w-64'"
    class="flex flex-col h-screen px-4 py-8 overflow-y-auto bg-white border-r border-gray-100 shrink-0 transition-all duration-300 ease-in-out relative">

    <button (click)="toggleSidebar()"
        class="absolute -right-3 top-10 bg-indigo-600 text-white rounded-full p-1 shadow-lg hover:bg-indigo-700 transition-colors">
        <svg [class.rotate-180]="isCollapsed()" class="w-4 h-4 transition-transform duration-300" fill="none"
            stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
    </button>

    <div class="flex items-center gap-2 px-2">
        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center shrink-0">
            <span class="text-white font-black text-xl italic">S</span>
        </div>
        @if (!isCollapsed()) {
        <span class="text-gray-800 font-bold text-xl tracking-tight animate-in fade-in duration-300">SIMPLE<span
                class="text-indigo-600">.pos</span></span>
        }
    </div>

    <div class="flex flex-col justify-between flex-1 mt-10">
        <nav class="flex-1 -mx-2 space-y-3">
            <a routerLink="/" routerLinkActive="bg-indigo-50 text-indigo-700 border-r-4 border-indigo-600"
                [routerLinkActiveOptions]="{exact: true}" class="flex items-center px-3 py-3 ...">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
                    </path>
                </svg>
                @if (!isCollapsed()) { <span class="mx-3">Dashboard</span> }
            </a>
            <a routerLink="/pos" routerLinkActive="bg-indigo-50 text-indigo-700 border-r-4 border-indigo-600"
                [routerLinkActiveOptions]="{exact: true}"
                class="flex items-center px-3 py-3 text-gray-600 transition-colors rounded-lg hover:bg-gray-100">
                <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z">
                    </path>
                </svg>
                @if (!isCollapsed()) {
                <span class="mx-3 font-medium animate-in slide-in-from-left-2 duration-200">POS Terminal</span>
                }
            </a>

            <a routerLink="/products" routerLinkActive="bg-indigo-50 text-indigo-700 border-r-4 border-indigo-600"
                class="flex items-center px-3 py-3 text-gray-600 transition-colors rounded-lg hover:bg-gray-100">
                <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                </svg>
                @if (!isCollapsed()) {
                <span class="mx-3 font-medium animate-in slide-in-from-left-2 duration-200">Products</span>
                }
            </a>


            <a routerLink="/customers" routerLinkActive="bg-indigo-50 text-indigo-700 border-r-4 border-indigo-600"
                class="flex items-center px-3 py-3 text-gray-600 transition-colors rounded-lg hover:bg-gray-100">
                <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
                </svg>
                @if (!isCollapsed()) {
                <span class="mx-3 font-medium animate-in slide-in-from-left-2 duration-200">Customers</span>
                }
            </a>


        </nav>

        <div class="mt-6 border-t pt-6">
            <div class="flex items-center gap-x-2 px-1">
                <div
                    class="w-10 h-10 shrink-0 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold">
                    AD
                </div>
                @if (!isCollapsed()) {
                <div class="animate-in fade-in duration-300 overflow-hidden">
                    <h1 class="text-sm font-semibold text-gray-700 truncate">Admin User</h1>
                    <p class="text-xs text-gray-500">Main Station</p>
                </div>
                }
            </div>
        </div>
    </div>
</aside>
